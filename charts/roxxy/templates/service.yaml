apiVersion: v1
kind: Service
metadata:
  name: {{ include "roxxy.fullname" . }}
  labels:
    {{- include "roxxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.proxyPort }}
      targetPort: proxy
      protocol: TCP
      name: proxy
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "roxxy.selectorLabels" . | nindent 4 }}
