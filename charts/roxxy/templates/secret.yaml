{{- if .Values.caCert.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roxxy.fullname" . }}-ca-cert
  labels:
    {{- include "roxxy.labels" . | nindent 4 }}
type: Opaque
data:
  ca-cert.pem: {{ .Values.caCert.cert | required "caCert.cert is required when caCert.create is true" }}
  ca-key.pem: {{ .Values.caCert.key | required "caCert.key is required when caCert.create is true" }}
{{- end }}
