# Default values for roxxy
replicaCount: 1

image:
  repository: ghcr.io/delphos/roxxy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  proxyPort: 3128
  httpsPort: 443

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: roxxy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# CA certificate secret configuration
caCert:
  # If true, create a secret from the provided cert/key
  # If false, expects an existing secret
  create: false
  # Name of existing secret (if create is false)
  existingSecret: ""
  # Base64-encoded CA certificate (required if create is true)
  cert: ""
  # Base64-encoded CA private key (required if create is true)
  key: ""

# Cache storage configuration
cache:
  # Enable persistent storage for cache
  enabled: true
  # Storage class name (leave empty for default)
  storageClassName: ""
  # Access mode for the PVC
  accessMode: ReadWriteOnce
  # Size of the cache volume
  size: 10Gi
  # Annotations for the PVC
  annotations: {}
  # Use existing PVC (if set, other cache settings are ignored)
  existingClaim: ""

# Configuration (structured — rendered into config.yaml by the configmap template)
config:
  global:
    cacheDir: /app/cache
    certsDir: /app/certs
    listenAddr: ":3128"
    # Automatically add Kubernetes service DNS names as local hostnames
    # Generates: <fullname>, <fullname>.<namespace>, <fullname>.<namespace>.svc, <fullname>.<namespace>.svc.cluster.local
    autoLocalHostnames: true
    # Additional hostnames to treat as localhost (merged with auto-generated ones)
    localHostnames: []
    #  - my-custom-alias
  packageManagers:
    - type: apk
      upstream_url: "https://dl-cdn.alpinelinux.org"
      hostnames:
        - dl-cdn.alpinelinux.org
    - type: apt
      upstream_url: "https://deb.debian.org"
      hostnames:
        - deb.debian.org
    - type: npm
      upstream_url: "https://registry.npmjs.org"
      hostnames:
        - registry.npmjs.org
    - type: pypi
      upstream_url: "https://pypi.org"
      hostnames:
        - pypi.org
        - files.pythonhosted.org
  dockerRegistries:
    - upstream_url: "https://registry-1.docker.io"
      hostnames:
        - docker.io
        - registry-1.docker.io

# Probe configuration
probes:
  liveness:
    path: /api/v1/certs/ca
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /api/v1/certs/ca
    initialDelaySeconds: 3
    periodSeconds: 5

# Extra environment variables
extraEnv: []
  # - name: HTTP_PROXY
  #   value: "http://upstream-proxy:8080"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}
